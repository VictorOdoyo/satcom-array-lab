[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satcom-array-lab"
version = "0.1.0"
description = "Satellite orbit geometry phased arrays link tracking and handover laboratory"
readme = "README.md"
authors = [{name = "Victor Odoyo"}]
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "build>=1"]

[project.scripts]
satlab = "satlab.cli:main"

[project.urls]
Repository = "https://github.com/VictorOdoyo/satcom-array-lab"
Documentation = "https://github.com/VictorOdoyo/satcom-array-lab/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
